name: Review Workflow

on:
  pull_request:
    branches:
    - main
    - linus
    - test

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on:
      group: arc-prod-blue

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Checkout prompts repo
      uses: actions/checkout@v6
      with:
        repository: 'masoncl/review-prompts'
        path: 'review'

    - name: Run GNAI review
      id: review
      uses: intel-innersource/frameworks.actions.gnai.agentic-code-review@v1
      with:
        execution-log-path: ${{ github.workspace }}/review-log.json
        review-instructions-file: .github/code-review-instructions.md

    - name: Upload review artifacts
      uses: actions/upload-artifact@v4
      if: always() && steps.review.outputs.execution-file
      with:
        name: review-execution-log
        path: ${{ steps.review.outputs.execution-file }}

