name: Review Workflow

on:
  pull_request:
    branches:
    - main
    - linus
    - test

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on:
      group: arc-prod-blue

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Checkout prompts repo
      uses: actions/checkout@v6
      with:
        repository: 'masoncl/review-prompts'
        path: 'review'

    - name: Run GNAI review
      uses: intel-innersource/frameworks.actions.gnai.agentic-code-review@v1
      with:
        review-instructions-file: review/kernel/review-core.md

