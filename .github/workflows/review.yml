name: Review Workflow

on:
  pull_request:
    branches:
    - main
    - linus
    - test

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on:
      group: arc-prod-blue

    steps:
    - uses: actions/checkout@v6
    - uses: intel-innersource/frameworks.actions.gnai.agentic-code-review@v1

