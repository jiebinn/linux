name: Sync with Upstream Linux Kernel

on:
  schedule:
    # Check for new upstream tags every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on:
      group: arc-prod-blue
    permissions:
      contents: write
      issues: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Full history needed for rebasing
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Add upstream remote
      run: |
        git remote add upstream https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git || true
        git remote set-url upstream https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
    
    - name: Fetch upstream tags
      run: |
        git fetch upstream --tags
    
    - name: Find latest upstream tag
      id: latest-tag
      run: |
        # Pick the most recently created valid upstream kernel tag. This lets us
        # follow whichever release happened last, whether stable (v7.0) or RC
        # (v7.0-rc1, v7.1-rc1, etc.).
        LATEST_TAG=$(git for-each-ref \
          --sort=-creatordate \
          --format='%(refname:strip=2)' \
          refs/tags/v* | \
          grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?(-rc[0-9]+)?$' | \
          head -1)

        if [ -z "$LATEST_TAG" ]; then
          echo "Error: No valid upstream kernel tags found." >&2
          exit 1
        fi
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "Latest upstream tag: $LATEST_TAG"
    
    - name: Check if we need to update
      id: check-update
      run: |
        LATEST_TAG="${{ steps.latest-tag.outputs.latest_tag }}"
        
        # Check if this tag already exists in our main branch
        if git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
          echo "Already up to date with $LATEST_TAG"
          echo "needs_update=false" >> $GITHUB_OUTPUT
        else
          echo "Need to update to $LATEST_TAG"
          echo "needs_update=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Rebase to latest upstream tag
      if: steps.check-update.outputs.needs_update == 'true'
      run: |
        LATEST_TAG="${{ steps.latest-tag.outputs.latest_tag }}"
        echo "Rebasing main branch to $LATEST_TAG"
        
        # Create a backup branch and push it to origin so it is recoverable after the force-push
        BACKUP_BRANCH="backup-before-rebase-$(date +%Y%m%d-%H%M%S)"
        git branch "$BACKUP_BRANCH"
        git push origin "$BACKUP_BRANCH"
        
        # Rebase main to the latest upstream tag
        git rebase "$LATEST_TAG"
    
    - name: Push updated main branch
      if: success() && steps.check-update.outputs.needs_update == 'true'
      run: |
        LATEST_TAG="${{ steps.latest-tag.outputs.latest_tag }}"
        git push origin main --force-with-lease
        
        # Create a release/tag for tracking
        git tag "synced-to-$LATEST_TAG" -m "Synced to upstream $LATEST_TAG"
        git push origin "synced-to-$LATEST_TAG"
    
    - name: Create Issue on Sync Failure
      if: failure() && steps.check-update.outputs.needs_update == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const title = `Upstream sync to ${{ steps.latest-tag.outputs.latest_tag }} failed`;
          const body = `The automated sync to upstream tag ${{ steps.latest-tag.outputs.latest_tag }} failed.
          
          This may be due to rebase conflicts, push or tag permission issues, or other errors in the sync workflow.
          
          Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['automation', 'sync-failure']
          });

    - name: Create Success Issue
      if: success() && steps.check-update.outputs.needs_update == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Successfully synced to ${{ steps.latest-tag.outputs.latest_tag }}`,
            body: `Repository has been successfully rebased to upstream tag ${{ steps.latest-tag.outputs.latest_tag }}.`,
            labels: ['automation', 'sync-success']
          });	
