name: Warm Kernel Git Cache

# Producer for the kernel .git cache consumed by the PR review workflows
# (knitpick-review.yml, sashiko-review.yml). Runs on the default branch so the
# caches it writes are visible to all PR runs (GitHub only lets a PR restore
# caches from its own branch, its base, or the default branch).
#
# This is purely a performance accelerator: if the cache is missing or stale,
# the review workflows' own checkout just fetches more. It is never
# authoritative, so a failed warm run cannot break reviews — only slow them.
#
# Deliberately decoupled from sync.yml: this clones independently and never
# writes to the repo, so the critical upstream-sync/force-push path stays
# isolated from this optimization.

on:
  schedule:
    # 30 min after sync.yml's 6h cron, so we warm shortly after main may rebase.
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: warm-kernel-cache
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # required to delete old caches via the gh CLI

jobs:
  warm:
    runs-on:
      group: arc-prod-blue
    timeout-minutes: 120

    steps:
      - name: Checkout kernel (default branch)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: kernel

      # Evict every existing kernel-git-* cache before uploading the new one.
      # Each entry is ~5 GB; keeping more than one would blow the 10 GB repo
      # cache budget and LRU-evict other caches (e.g. the sashiko binary). The
      # new key (kernel-git-<current-sha>) does not exist yet, so this never
      # deletes the entry we are about to save. Best-effort: a failure here
      # must not block the save, so it never fails the step.
      #
      # Uses github-script (not the gh CLI): every other workflow here uses it,
      # it needs no external binary on the runner, and it hits the same cache
      # REST API the gh cache commands wrap.
      - name: Evict old kernel .git caches
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = 'kernel-git-';
            const res = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: prefix,
              per_page: 100,
            });
            for (const cache of res.data.actions_caches) {
              console.log(`Deleting cache ${cache.id} (${cache.key})`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }

      - name: Save kernel .git to cache
        uses: actions/cache/save@v4
        with:
          # Cache only .git; the review checkouts reuse it and materialize the
          # working tree themselves. Keyed on the default-branch HEAD, so a new
          # entry is written only when main moves (e.g. after an upstream sync).
          # cache/save is idempotent: if the key already exists, the upload is
          # skipped.
          path: kernel/.git
          key: kernel-git-${{ github.sha }}
