name: Sashiko Review (smoke test)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      max_patches:
        description: "Max patches to review before aborting"
        required: false
        default: "50"

permissions:
  contents: read
  pull-requests: write

env:
  SASHIKO_REPO: rgushchin/sashiko
  SASHIKO_REF: main
  MODEL: us.anthropic.claude-sonnet-4-6
  MAX_PATCHES: ${{ github.event.inputs.max_patches || '50' }}
  AWS_REGION: us-east-2

jobs:
  review:
    runs-on:
      group: arc-prod-blue
    timeout-minutes: 120

    steps:
      - name: Checkout kernel (PR head)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: kernel

      - name: Checkout sashiko
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SASHIKO_REPO }}
          ref: ${{ env.SASHIKO_REF }}
          path: sashiko

      - name: Install build dependencies
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libssl-dev ca-certificates curl
          elif command -v dnf >/dev/null; then
            sudo dnf install -y gcc gcc-c++ make pkgconfig openssl-devel ca-certificates curl
          else
            echo "::error::No supported package manager (apt-get / dnf) found on this runner"
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache sashiko build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sashiko/target
          key: sashiko-cargo-${{ runner.os }}-${{ hashFiles('sashiko/Cargo.lock') }}
          restore-keys: |
            sashiko-cargo-${{ runner.os }}-

      - name: Build sashiko review binary
        working-directory: sashiko
        run: cargo build --release --bin review

      - name: Write sashiko Settings.toml
        working-directory: sashiko
        run: |
          cat > Settings.toml <<EOF
          log_level = "info"

          [database]
          url = "sashiko.db"
          token = ""

          [mailing_lists]
          track = []

          [nntp]
          server = "nntp.lore.kernel.org"
          port = 119

          [ai]
          provider = "bedrock"
          model = "${MODEL}"
          max_input_tokens = 950000

          [ai.bedrock]
          region = "${AWS_REGION}"

          [ai.claude]
          prompt_caching = true

          [server]
          host = "127.0.0.1"
          port = 8080

          [git]
          repository_path = "${GITHUB_WORKSPACE}/kernel"

          [review]
          concurrency = 1
          worktree_dir = "${RUNNER_TEMP}/sashiko-worktrees"
          timeout_seconds = 7200
          max_retries = 3
          ignore_files = ["MAINTAINERS", ".mailmap", ".gitignore", "LICENSES/"]
          EOF

      - name: Run sashiko review
        id: review
        env:
          # Smoke-test path: reuse the Bedrock bearer token.
          # TODO: swap to OIDC + aws-actions/configure-aws-credentials.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          REPO_PATH: ${{ github.workspace }}/kernel
          SASHIKO_PATH: ${{ github.workspace }}/sashiko
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_DIR: ${{ github.workspace }}/sashiko-out
          SASHIKO_LOG_PLAIN: "1"
          RUST_LOG: info
        run: |
          .github/scripts/sashiko-review.sh
        working-directory: kernel

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sashiko-review
          path: sashiko-out/
          if-no-files-found: ignore

      - name: Post PR comment
        if: github.event_name == 'pull_request' && hashFiles('sashiko-out/comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sashiko-out/comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
