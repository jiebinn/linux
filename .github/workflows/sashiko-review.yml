name: Sashiko Review (smoke test)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      max_patches:
        description: "Max patches to review before aborting"
        required: false
        default: "35"

permissions:
  contents: read
  pull-requests: write

env:
  SASHIKO_REPO: rgushchin/sashiko
  MODEL: us.anthropic.claude-opus-4-7
  MAX_PATCHES: ${{ github.event.inputs.max_patches || '35' }}
  AWS_REGION: us-east-2

jobs:
  review:
    runs-on:
      group: arc-prod-blue
    timeout-minutes: 600

    steps:
      # Restore the kernel .git warmed by warm-cache.yml so the checkout
      # below only fetches the PR delta instead of re-cloning the whole tree.
      # restore-only (never save): PR runs must not upload a multi-GB cache.
      # The kernel-git- prefix grabs the most recent warmed entry without
      # needing to know the current default-branch SHA. Purely an accelerator;
      # on a miss the checkout just fetches more.
      - name: Restore kernel .git cache
        uses: actions/cache/restore@v4
        with:
          path: kernel/.git
          key: kernel-git-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            kernel-git-

      - name: Checkout kernel (PR head)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: kernel

      - name: Resolve latest sashiko tag
        id: sashiko-tag
        run: |
          # Track the highest version tag. sashiko publishes no GitHub
          # Releases, only tags like v.0.2.1; --refs drops the ^{} deref
          # entries and sort -V handles version ordering (e.g. .8 < .10).
          TAG=$(git ls-remote --tags --refs "https://github.com/${SASHIKO_REPO}" \
                  | awk -F/ '{print $NF}' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a sashiko tag from ${SASHIKO_REPO}"
            exit 1
          fi
          echo "Latest sashiko tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout sashiko
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SASHIKO_REPO }}
          ref: ${{ steps.sashiko-tag.outputs.tag }}
          path: sashiko

      # Restore the sashiko target/release tree built on main by warm-cache.yml.
      # It contains only the executables (no deps/, .fingerprint/, etc.); the
      # review step runs ./target/release/review directly, so the binary alone
      # is enough on a hit. restore-only (never save): only the main-branch
      # warmer produces this cache, so it is shared across all PRs (a PR-saved
      # cache would be visible only to that PR). Restore AFTER checkout, which
      # runs `git clean -ffdx` and would otherwise delete the restored
      # (gitignored) tree. On a miss (e.g. a new tag not yet warmed) the build
      # steps below run as a fallback so the review still works.
      - name: Restore sashiko target cache
        id: bincache
        uses: actions/cache/restore@v4
        with:
          path: sashiko/target/release
          key: sashiko-target-${{ runner.os }}-${{ steps.sashiko-tag.outputs.tag }}

      - name: Install build dependencies
        if: steps.bincache.outputs.cache-hit != 'true'
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libssl-dev ca-certificates curl
          elif command -v dnf >/dev/null; then
            sudo dnf install -y gcc gcc-c++ make pkgconfig openssl-devel ca-certificates curl
          else
            echo "::error::No supported package manager (apt-get / dnf) found on this runner"
            exit 1
          fi

      - name: Install Rust toolchain
        if: steps.bincache.outputs.cache-hit != 'true'
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build sashiko review binary
        if: steps.bincache.outputs.cache-hit != 'true'
        working-directory: sashiko
        run: cargo build --release --bin review

      - name: Write sashiko Settings.toml
        working-directory: sashiko
        run: |
          cat > Settings.toml <<EOF
          log_level = "info"

          [database]
          url = "sashiko.db"
          token = ""

          [mailing_lists]
          track = []

          [nntp]
          server = "nntp.lore.kernel.org"
          port = 119

          [ai]
          provider = "bedrock"
          model = "${MODEL}"
          max_input_tokens = 950000

          [ai.bedrock]
          region = "${AWS_REGION}"

          [ai.claude]
          prompt_caching = true

          [server]
          host = "127.0.0.1"
          port = 8080

          [git]
          repository_path = "${GITHUB_WORKSPACE}/kernel"

          [review]
          concurrency = 1
          worktree_dir = "${RUNNER_TEMP}/sashiko-worktrees"
          timeout_seconds = 7200
          max_retries = 3
          ignore_files = ["MAINTAINERS", ".mailmap", ".gitignore", "LICENSES/"]
          EOF

      - name: Run sashiko review
        id: review
        env:
          # Smoke-test path: reuse the Bedrock bearer token.
          # TODO: swap to OIDC + aws-actions/configure-aws-credentials.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          REPO_PATH: ${{ github.workspace }}/kernel
          SASHIKO_PATH: ${{ github.workspace }}/sashiko
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_DIR: ${{ github.workspace }}/sashiko-out
          SASHIKO_LOG_PLAIN: "1"
          RUST_LOG: info
        run: |
          .github/scripts/sashiko-review.sh
        working-directory: kernel

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sashiko-review
          path: sashiko-out/
          if-no-files-found: ignore

      - name: Post PR comment
        if: github.event_name == 'pull_request' && hashFiles('sashiko-out/comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sashiko-out/comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
