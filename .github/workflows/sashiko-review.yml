name: Sashiko Review (smoke test)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      max_patches:
        description: "Max patches to review before aborting"
        required: false
        default: "35"
      sashiko_tag:
        description: "Sashiko tag to pin (e.g. v.0.2.1) — overrides the repo variable for this run; blank uses the latest tag"
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  # Defaults point at the custom fork (Vertex/Gemini provider). Override any of
  # these with a repo variable to fall back to upstream/Bedrock without editing
  # this file.
  SASHIKO_REPO: ${{ vars.SASHIKO_REPO || 'intel-sandbox/sashiko' }}
  # Pin a release/ref here (input wins, then the SASHIKO_TAG repo variable);
  # a non-empty default skips the "resolve the latest tag" path below. PR runs
  # can't take inputs, so set the SASHIKO_TAG variable to change it across PRs.
  SASHIKO_TAG: ${{ github.event.inputs.sashiko_tag || vars.SASHIKO_TAG || '' }}
  # Selects which committed config file is used (Settings.<provider>.toml) and,
  # via SASHIKO_FEATURES, which cargo features the review binary is built with.
  SASHIKO_PROVIDER: ${{ vars.SASHIKO_PROVIDER || 'vertex' }}
  SASHIKO_FEATURES: ${{ vars.SASHIKO_FEATURES || 'vertex' }}
  # Vertex/Gemini auth: project comes from a repo variable (no safe default);
  # region defaults to "global" (Gemini's multi-region endpoint). Both feed
  # sashiko's env fallback chain.
  VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID || '' }}
  VERTEX_REGION: ${{ vars.VERTEX_REGION || 'global' }}
  MAX_PATCHES: ${{ github.event.inputs.max_patches || '35' }}
  AWS_REGION: us-east-2

jobs:
  review:
    runs-on:
      group: arc-prod-blue
    timeout-minutes: 1200

    steps:
      # Restore the kernel .git warmed by warm-cache.yml so the checkout
      # below only fetches the PR delta instead of re-cloning the whole tree.
      # restore-only (never save): PR runs must not upload a multi-GB cache.
      # The kernel-git- prefix grabs the most recent warmed entry without
      # needing to know the current default-branch SHA. Purely an accelerator;
      # on a miss the checkout just fetches more.
      - name: Restore kernel .git cache
        uses: actions/cache/restore@v4
        with:
          path: kernel/.git
          key: kernel-git-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            kernel-git-

      - name: Checkout kernel (PR head)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: kernel

      - name: Resolve sashiko tag
        id: sashiko-tag
        env:
          # The fork is private; authenticate ls-remote with the same token the
          # checkout uses. Kept out of the script body so it never hits the log.
          SASHIKO_REPO_TOKEN: ${{ secrets.SASHIKO_REPO_TOKEN || github.token }}
        run: |
          # Honor a pinned tag (SASHIKO_TAG input/variable) so reviews can be
          # reverted to an older release; otherwise track the highest version
          # tag. sashiko publishes no GitHub Releases, only tags like v.0.2.1;
          # --refs drops the ^{} deref entries and sort -V handles version
          # ordering (e.g. .8 < .10).
          if [ -n "$SASHIKO_TAG" ]; then
            TAG="$SASHIKO_TAG"
            echo "Pinned sashiko tag: $TAG"
          else
            TAG=$(git ls-remote --tags --refs \
                    "https://x-access-token:${SASHIKO_REPO_TOKEN}@github.com/${SASHIKO_REPO}" \
                    | awk -F/ '{print $NF}' | sort -V | tail -1)
            echo "Latest sashiko tag: $TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a sashiko tag from ${SASHIKO_REPO}"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout sashiko
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SASHIKO_REPO }}
          ref: ${{ steps.sashiko-tag.outputs.tag }}
          # The fork is private; this PAT/App secret grants read access. Falls
          # back to the default token for a public upstream checkout.
          token: ${{ secrets.SASHIKO_REPO_TOKEN || github.token }}
          path: sashiko

      # Restore the sashiko target/release tree built on main by warm-cache.yml.
      # It contains only the executables (no deps/, .fingerprint/, etc.); the
      # review step runs ./target/release/review directly, so the binary alone
      # is enough on a hit. restore-only (never save): only the main-branch
      # warmer produces this cache, so it is shared across all PRs (a PR-saved
      # cache would be visible only to that PR). Restore AFTER checkout, which
      # runs `git clean -ffdx` and would otherwise delete the restored
      # (gitignored) tree. On a miss (e.g. a new tag not yet warmed) the build
      # steps below run as a fallback so the review still works.
      - name: Restore sashiko target cache
        id: bincache
        uses: actions/cache/restore@v4
        with:
          # Include the feature set so a binary built with different cargo
          # features (e.g. a Bedrock-only warm-cache build under the same tag) is
          # never restored here.
          path: sashiko/target/release
          key: sashiko-target-${{ runner.os }}-${{ steps.sashiko-tag.outputs.tag }}-${{ env.SASHIKO_FEATURES || 'default' }}

      - name: Install build dependencies
        if: steps.bincache.outputs.cache-hit != 'true'
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libssl-dev ca-certificates curl
          elif command -v dnf >/dev/null; then
            sudo dnf install -y gcc gcc-c++ make pkgconfig openssl-devel ca-certificates curl
          else
            echo "::error::No supported package manager (apt-get / dnf) found on this runner"
            exit 1
          fi

      - name: Install Rust toolchain
        if: steps.bincache.outputs.cache-hit != 'true'
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build sashiko review binary
        if: steps.bincache.outputs.cache-hit != 'true'
        working-directory: sashiko
        run: cargo build --release --bin review ${SASHIKO_FEATURES:+--features "$SASHIKO_FEATURES"}

      - name: Write sashiko Settings.toml
        working-directory: sashiko
        run: |
          # Render the committed per-provider config, filling in the
          # runner-specific paths (and the AWS region for the bedrock file).
          # The review repo is checked out under kernel/ (see "path: kernel"),
          # so the committed configs live there, not at the workspace root.
          SRC="${GITHUB_WORKSPACE}/kernel/.github/sashiko/Settings.${SASHIKO_PROVIDER}.toml"
          if [ ! -f "$SRC" ]; then
            echo "::error::No config file for provider '${SASHIKO_PROVIDER}' at $SRC"
            exit 1
          fi
          sed -e "s#__REPO_PATH__#${GITHUB_WORKSPACE}/kernel#" \
              -e "s#__WORKTREE_DIR__#${RUNNER_TEMP}/sashiko-worktrees#" \
              -e "s#__AWS_REGION__#${AWS_REGION}#" \
              "$SRC" > Settings.toml
          # Surface the model in the review comment header (display only; the
          # binary reads the model from Settings.toml).
          MODEL=$(sed -n 's/^model = "\(.*\)"/\1/p' Settings.toml | head -1)
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"

      # The Vertex provider authenticates via Google Cloud ADC; write the
      # service-account JSON secret to a file and point ADC at it.
      - name: Write GCP credentials
        if: env.SASHIKO_PROVIDER == 'vertex'
        run: |
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Run sashiko review
        id: review
        env:
          # Smoke-test path: reuse the Bedrock bearer token (unused under Vertex).
          # TODO: swap to OIDC + aws-actions/configure-aws-credentials.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # Vertex project/region fallbacks (harmless empty under Bedrock).
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ env.VERTEX_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ env.VERTEX_REGION }}
          REPO_PATH: ${{ github.workspace }}/kernel
          SASHIKO_PATH: ${{ github.workspace }}/sashiko
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_DIR: ${{ github.workspace }}/sashiko-out
          SASHIKO_LOG_PLAIN: "1"
          RUST_LOG: info
        run: |
          .github/scripts/sashiko-review.sh
        working-directory: kernel

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sashiko-review
          path: sashiko-out/
          if-no-files-found: ignore

      - name: Post PR comment
        if: github.event_name == 'pull_request' && hashFiles('sashiko-out/comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sashiko-out/comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
